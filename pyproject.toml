[project]
name = "fact-assessor"
version = "0.1.0"
description = "Fast, async-first fact assessment for any text: atomic claims -> web evidence -> verdicts, fact score, and knowledge graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nish" }]
requires-python = ">=3.11"
keywords = ["fact-checking", "factuality", "claim-verification", "async", "llm", "laya"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-ai-slim[openai]>=2.49.0",
    "laya>=0.3.20",
    "crawl4ai>=0.9.4",
]

[project.urls]
Repository = "https://github.com/NISH1001/fact-assessor"

[project.optional-dependencies]
gliner = [
    "onnxruntime>=1.30.0",
]
ddg = [
    "ddgs>=9.16.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "marimo>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factassessor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
